[project]
name = "HardwarePCAgent"
version = "0.1.0"
description = "Autonomous PC hardware recommendation agent with LangGraph and deterministic compatibility validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.0",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.7.0",
    "pydantic>=2.10.0",
    "rich>=14.0.0",
    "python-dotenv>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
